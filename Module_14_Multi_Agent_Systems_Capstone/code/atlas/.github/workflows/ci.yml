# Atlas CI: lint, types, the full test suite against real Postgres (pgvector)
# and Ollama embeddings, coverage, and the offline eval gates.
# No secrets: the agent tests mock the Anthropic client; the key is a placeholder.
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check core agents scripts tests evals
      - name: Mypy
        run: python -m mypy core agents scripts --ignore-missing-imports

  test:
    name: Tests, coverage and eval gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: atlas
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas_ci
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas"
          --health-interval 5s --health-timeout 5s --health-retries 20
      ollama:
        image: ollama/ollama:latest
        ports: ["11435:11434"]
    env:
      ANTHROPIC_API_KEY: sk-ant-ci-placeholder
      ATLAS_MODEL_CEO: claude-opus-5-5
      ATLAS_MODEL_SPECIALIST: claude-sonnet-5-5
      ATLAS_MODEL_SCAN: claude-haiku-5-5
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5434"
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas_ci
      OLLAMA_URL: http://localhost:11435
      OLLAMA_EMBED_MODEL: nomic-embed-text
      OLLAMA_EMBED_DIM: "768"
      ATLAS_ENV: local
      ATLAS_TIMEZONE: America/Chicago
      ATLAS_DAILY_USD_CAP: "8"
      ATLAS_HEARTBEAT_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Pull the embedding model
        run: |
          for i in $(seq 1 30); do curl -sf http://localhost:11435/api/tags >/dev/null && break; sleep 2; done
          curl -sf http://localhost:11435/api/pull -d '{"name": "nomic-embed-text", "stream": false}' | tail -c 200
      - name: Apply migrations
        env:
          PGPASSWORD: atlas_ci
        run: |
          for f in db/migrations/*.sql; do
            psql -h localhost -p 5434 -U atlas -d atlas -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Tests with coverage
        run: |
          set -o pipefail
          python -m pytest -q --cov=core --cov=agents --cov-report=term --cov-report=xml | tee pytest.log
          echo "### Tests" >> "$GITHUB_STEP_SUMMARY"
          grep -E "passed|failed" pytest.log | tail -1 >> "$GITHUB_STEP_SUMMARY"
          grep -E "^TOTAL" pytest.log | awk '{print "Coverage: " $NF}' >> "$GITHUB_STEP_SUMMARY"
      - name: Eval gates
        run: |
          set -o pipefail
          python -m scripts.eval_report --check | tee evals.log
          echo "### Offline evals" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -v "miss:" evals.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml
