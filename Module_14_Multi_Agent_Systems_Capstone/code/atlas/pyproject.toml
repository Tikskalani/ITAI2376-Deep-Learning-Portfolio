[project]
name = "atlas"
version = "0.1.0"
description = "Trilok's personal multi-agent ecosystem"
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
  # Core
  "anthropic>=1.11,<2",         # Messages API client, direct (1.x: httpx2, fallbacks, output_config)
  "asyncpg>=0.30.0",            # async Postgres
  "psycopg[binary]>=3.2.0",     # sync Postgres for migrations and one-off scripts
  "pgvector>=0.3.6",            # pgvector adapter for asyncpg/psycopg

  # Discovery -- YouTube ingestion for news_discovery
  "youtube-transcript-api>=1.0.0",
  "yt-dlp[default]>=2026.10.21", # 2026.03 got 403 from YouTube; [default] adds curl_cffi and the EJS challenge solver
  "curl_cffi>=0.7",             # TLS impersonation so YouTube does not bot-block yt-dlp
  "faster-whisper>=1.0.0",      # local speech-to-text for reel/video audio
  "mcp>=1.10,<2",               # MCP server (stdio and HTTP); 2.x renamed FastMCP and changed the API

  # Surface
  "cryptography>=42.0",         # Web Push (RFC 8291/8292) in core/surfaces/webpush.py
  "fastapi>=0.115.0",           # web dashboard and API (core/web/api.py)
  "uvicorn>=0.30.0",            # ASGI server for scripts/run_web.py
  "python-multipart>=0.0.9",    # FastAPI UploadFile on /api/upload
  "pypdf>=5.0.0",               # PDF text extraction on /api/upload
  "reportlab>=4.2",             # one-page tailored resume PDFs (core/jobs/resume_pdf.py)

  # Scheduling
  "APScheduler>=3.10.4",

  # Embeddings via local Ollama, plain HTTP, no extra client lib needed
  "httpx>=0.27.0",

  # Config and validation
  "python-dotenv>=1.0.1",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",

  # Markdown procedures and YAML workflows
  "python-frontmatter>=1.1.0",
  "pyyaml>=6.0",                # workflows/<name>.yml (core/workflows.py)
  "defusedxml>=0.7",            # feeds are untrusted XML (core/news.py)

  # Logging
  "structlog>=24.4.0",

  # Utilities
  "tenacity>=9.0.0",            # retries on transient API failures
  "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
# The job submitter's browser (core/jobs/submit/browser.py). After installing:
# python -m playwright install chromium
submit = [
  "playwright>=1.47",
  "pillow>=10",  # the form screenshots are cut into readable pages (core/jobs/submit/shots.py)
]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "agents*"]

[tool.ruff]
line-length = 100
target-version = "py312"
# The APEX engine and its tests are kept as copied (core/resume_engine/PROVENANCE.md).
extend-exclude = [
  "core/resume_engine/apex_engine.py",
  "core/resume_engine/apex_domains.py",
  "tests/test_resume_engine.py",
  "tests/test_resume_engine_flow.py",
  "tests/test_resume_engine_gate.py",
  "tests/test_resume_engine_parse.py",
  "tests/test_resume_engine_quality.py",
  "tests/test_resume_engine_vault.py",
  "tests/test_resume_engine_benchmark.py",
  "evals/resume_bench/apex_benchmark.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]

[[tool.mypy.overrides]]
module = ["core.resume_engine.apex_engine", "core.resume_engine.apex_domains"]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
