<!-- ================= TOP BAR ================= -->
<header class="topbar">
  <button class="mark" @click="goRoom('bridge')" aria-label="Atlas, back to Today" title="Atlas v0.18.0"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="10" fill="none" stroke="#7FB2FF" stroke-width="1.2"/><circle cx="13" cy="13" r="2.6" fill="#D8F0FF"/><circle cx="13" cy="3" r="1.8" fill="#7FB2FF"/><circle cx="21.7" cy="18" r="1.8" fill="#7FB2FF"/><circle cx="4.3" cy="18" r="1.8" fill="#7FB2FF"/></svg>Atlas</button>
  <nav class="tb-nav" aria-label="Rooms">
    <template x-for="r in rooms()" :key="r.id">
      <button @click="goRoom(r.id)" :aria-current="room === r.id ? 'page' : null" :title="r.label + ' (' + r.key + ')'"><span x-text="r.label.toUpperCase()"></span><b :class="r.tone" x-show="r.count" x-text="r.count"></b></button>
    </template>
  </nav>
  <span class="grow"></span>
  <span class="tb-demo" x-show="demo" x-cloak title="Invented data: nothing here is real. Open /?demo=0 to leave.">DEMO DATA</span>
  <span class="tb-status" :class="{lost: health && !sysNormal()}" role="status" :title="sysTitle()"><i></i><span x-text="health ? (sysNormal() ? 'ALL SYSTEMS NORMAL' : (health.ok ? 'SOMETHING NEEDS A LOOK' : sysLabel().toUpperCase())) : 'CONNECTING'"></span></span>
  <button class="tb-btn" @click="openPalette()" title="Search or run a command (Ctrl+K)" aria-label="Command palette"><svg class="ic sm"><use href="#i-search"/></svg><span class="kbd">CTRL K</span></button>
  <button class="tb-btn" :aria-pressed="String(focus)" @click="toggleFocus()" title="Focus mode: calm the screen for reading (F)" aria-label="Focus mode"><svg class="ic sm"><use href="#i-monitor"/></svg><span class="tb-label">FOCUS</span></button>
  <button class="tb-btn" :aria-pressed="String(pushOn)" @click="togglePush()" :disabled="pushBusy" :title="pushTitle()" aria-label="Push notifications"><svg class="ic sm"><use href="#i-bell"/></svg></button>
</header>

<!-- ================= ROOMS ================= -->
<main x-ref="main" class="rooms" :data-room="room" @scroll.passive="scrolled = $event.target.scrollTop > 4" :class="{scrolled}">
  <div data-slot="bridge"></div>
  <div data-slot="comms"></div>
  <div data-slot="plan"></div>
  <div data-slot="career"></div>
  <div data-slot="staff"></div>
  <div data-slot="inbox"></div>
  <div data-slot="memory"></div>
  <div data-slot="settings"></div>
</main>

<!-- ================= ARC DOCK ================= -->
<nav class="dock" aria-label="Rooms">
  <template x-for="r in rooms()" :key="r.id">
    <button class="mod" @click="goRoom(r.id)" :aria-current="room === r.id ? 'page' : null" :title="r.label + ' (' + r.key + ')'">
      <svg class="ic"><use :href="'#i-' + r.icon"/></svg>
      <span class="badge" :class="r.tone" x-show="r.count" x-text="r.count"></span>
      <span class="lbl" x-text="r.short || r.label"></span><span class="key" x-text="r.key"></span>
    </button>
  </template>
</nav>

<!-- ================= SUMMON RING ================= -->
<div class="ring" x-show="ring.open" x-cloak :style="'left:' + ring.x + 'px;top:' + ring.y + 'px'" role="menu" aria-label="Rooms">
  <svg viewBox="0 0 260 260">
    <circle cx="130" cy="130" r="127" class="ring-orbit"/>
    <!-- One segment per room, drawn as a string: Alpine cannot loop a template inside SVG. -->
    <g x-html="ringSvg()"></g>
    <circle cx="130" cy="130" r="44" class="ring-hub"/>
    <text x="130" y="127" text-anchor="middle" class="ring-hub-t" x-text="ring.hi >= 0 ? 'RELEASE' : 'SLIDE'"></text>
    <text x="130" y="141" text-anchor="middle" class="ring-hub-s" x-text="ring.hi >= 0 ? 'TO OPEN' : 'TO A ROOM'"></text>
  </svg>
</div>

<div data-slot="overlays"></div>

</body>
</html>
